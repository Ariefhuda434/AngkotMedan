<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4da2ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Semua Trayek — AngkotMedan</title>
  <meta name="description" content="Jelajahi semua 118 trayek angkot di Medan. Cari berdasarkan warna livery atau operator.">
  <meta property="og:title" content="Semua Trayek — AngkotMedan">
  <meta property="og:description" content="Jelajahi semua 118 trayek angkot di Medan. Cari berdasarkan warna livery atau operator.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="img/hero-angkot.jpg">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234da2ff' stroke='%23000' stroke-width='2'/><rect x='4' y='11' width='24' height='11' rx='4' fill='%23000'/><rect x='6' y='13' width='7' height='6' rx='2' fill='%234da2ff'/><rect x='15' y='13' width='7' height='6' rx='2' fill='%234da2ff'/><circle cx='9' cy='23' r='2.5' fill='%23000'/><circle cx='23' cy='23' r='2.5' fill='%23000'/><circle cx='9' cy='23' r='1.2' fill='%234da2ff'/><circle cx='23' cy='23' r='1.2' fill='%234da2ff'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mustard: '#ffd731',
            navy: '#4da2ff',
            'mint-pop': '#55db9c',
            ember: '#fb4903',
          },
          fontFamily: {
            display: ['"Bowlby One SC"', 'system-ui', 'sans-serif'],
            body: ['"Inter"', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'brutal': '3px 3px 0px 0px #000000',
            'brutal-sm': '2px 2px 0px 0px #000000',
            'brutal-lg': '5px 5px 0px 0px #000000',
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    /* Fix letak kontrol Leaflet Map di dalam Modal */
    .leaflet-top { top: 10px !important; }
    .leaflet-bottom { bottom: 10px !important; }
  </style>
</head>
<body class="bg-[#dceeff] min-h-screen flex flex-col font-body text-[#000000] antialiased slush-canvas">

  <!-- NAVBAR -->
  <nav class="sticky top-0 z-50 bg-[#ffffff]/95 backdrop-blur-sm border-b-2 border-[#000000]">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-1.5 group shrink-0">
        <img src="logo.png" alt="Angkot Medan" class="w-14 h-14 sm:w-16 sm:h-16 lg:w-20 lg:h-20 object-contain" />
        <div class="hidden sm:block">
          <p class="font-display font-bold text-sm leading-none tracking-tight text-[#000000]">Angkot<span class="text-[#ffd731]">Medan</span></p>
          <p class="font-body text-[10px] text-[#000]/40 leading-none mt-0.5 tracking-wide">FINDER</p>
        </div>
      </a>
      <div class="flex items-center gap-0.5 sm:gap-1">
        <span class="hidden sm:inline-flex items-center px-3 py-1 bg-[#4da2ff]/15 text-[#4da2ff] font-display font-bold text-[11px] border-2 border-[#4da2ff]/30 mr-2 rounded-full">118</span>
        <a href="/" class="nav-link px-2 sm:px-3 py-1.5 font-display text-xs sm:text-sm font-medium text-[#000]/50 hover:text-[#000000] transition-colors relative" data-i18n="nav_home">Beranda</a>
        <a href="/tentang" class="nav-link px-2 sm:px-3 py-1.5 font-display text-xs sm:text-sm font-medium text-[#000]/50 hover:text-[#000000] transition-colors relative" data-i18n="nav_about">Tentang</a>
      </div>
    </div>
  </nav>

  <!-- EXPLORER PAGE -->
  <main class="pt-6 pb-20 flex-1">
    <div class="max-w-5xl mx-auto px-4">
      <section class="mb-8">
        <a href="/" class="inline-flex items-center gap-2 text-sm font-medium text-[#000]/50 hover:text-[#000000] transition-colors mb-6 group">
          <i data-lucide="arrow-left" class="w-4 h-4 group-hover:-translate-x-1 transition-transform"></i> <span data-i18n="btn_back">Beranda</span>
        </a>
        <h1 class="font-display text-3xl md:text-4xl font-bold text-[#000000] tracking-tight mb-4" data-i18n="explorer_title">Semua Trayek Angkot</h1>
        <p class="font-body text-base text-[#000]/55 max-w-2xl leading-relaxed" data-i18n="explorer_desc">Jelajahi seluruh trayek angkot di Medan. Klik kartu untuk lihat rute detail.</p>
      </section>

      <!-- SEARCH + FILTER -->
      <section class="mb-8" id="route-explorer">
        <div class="bg-white border-2 border-[#000000] shadow-brutal p-4 rounded-2xl">
          <div class="flex flex-col sm:flex-row gap-3">
            <div class="relative flex-1">
              <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-[#000]/30"></i>
              <input type="text" id="explorer-search" class="w-full pl-10 pr-4 py-3 bg-[#dceeff] border-2 border-[#000]/8 rounded-xl font-body text-sm focus:outline-none focus:border-[#4da2ff] focus:shadow-brutal-sm transition-all" placeholder="Cari nomor trayek atau nama operator..." data-i18n-placeholder="explorer_search">
            </div>
          </div>
            <div class="flex flex-wrap items-center justify-between mt-3 pt-3 border-t border-[#000]/8 gap-2">
              <p class="font-body text-xs text-[#000]/40" id="explorer-count"></p>
              <div class="flex flex-wrap gap-1.5">
              <button class="explorer-filter-btn px-3 py-1 bg-[#ffd731] border-2 border-[#000]/10 font-display text-[10px] font-bold rounded-full hover:border-[#000000] transition-all" data-filter="">Semua</button>
              <button class="explorer-filter-btn px-3 py-1 bg-[#ffd731]/30 border-2 border-[#000]/10 font-display text-[10px] font-bold rounded-full hover:border-[#000000] transition-all" data-filter="kuning">Kuning</button>
              <button class="explorer-filter-btn px-3 py-1 bg-[#4da2ff]/30 border-2 border-[#000]/10 font-display text-[10px] font-bold rounded-full hover:border-[#000000] transition-all" data-filter="biru">Biru</button>
              <button class="explorer-filter-btn px-3 py-1 bg-[#55db9c]/30 border-2 border-[#000]/10 font-display text-[10px] font-bold rounded-full hover:border-[#000000] transition-all" data-filter="hijau">Hijau</button>
              <button class="explorer-filter-btn px-3 py-1 bg-[#fb4903]/30 border-2 border-[#000]/10 font-display text-[10px] font-bold rounded-full hover:border-[#000000] transition-all" data-filter="merah">Merah</button>
            </div>
          </div>
        </div>
      </section>

      <!-- EXPLORER GRID -->
      <div id="explorer-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-8"></div>
      <div id="explorer-pagination" class="flex justify-center items-center gap-2 mt-6"></div>

      <!-- ROUTE DETAIL MODAL (DIPERBAIKI 100dvh + FLEX COL) -->
      <div id="route-detail-modal" class="fixed inset-0 z-[2000] hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" id="modal-backdrop"></div>
        <div class="absolute inset-0 sm:inset-auto sm:left-1/2 sm:top-1/2 sm:-translate-x-1/2 sm:-translate-y-1/2 w-full sm:w-[520px] h-[100dvh] sm:h-auto sm:max-h-[90vh] bg-[#ffffff] border-0 sm:border-2 border-[#000000] shadow-none sm:shadow-brutal-lg rounded-none sm:rounded-2xl flex flex-col overflow-hidden">
          
          <div class="shrink-0 bg-white border-b-2 border-[#000]/8 px-4 sm:px-6 py-4 flex items-center justify-between z-10">
            <h3 class="font-display text-lg font-bold text-[#000000] truncate pr-4" id="modal-route-title">Rute</h3>
            <button id="modal-close" class="shrink-0 w-8 h-8 flex items-center justify-center rounded-full border-2 border-[#000]/10 hover:border-[#fb4903] hover:bg-[#fb4903]/10 transition-all">
              <i data-lucide="x" class="w-4 h-4 text-[#000000]"></i>
            </button>
          </div>
          
          <div class="flex-1 overflow-y-auto px-4 sm:px-6 py-5 space-y-6 bg-[#f7f9fc] sm:bg-white">
            <div class="grid grid-cols-3 gap-2 sm:gap-3" id="modal-stats"></div>
            <div id="modal-map" class="h-48 md:h-64 bg-[#dceeff] border-2 border-[#000000] rounded-xl overflow-hidden relative z-0"></div>
            <div class="bg-white sm:bg-transparent p-4 sm:p-0 border-2 border-[#000000] sm:border-0 rounded-xl sm:rounded-none">
              <h4 class="font-display text-sm font-bold mb-4" data-i18n="modal_stops">Daftar Halte & Waypoints</h4>
              <div id="modal-stops" class="space-y-0 pl-1"></div>
            </div>
            <button id="modal-search-btn" class="w-full py-3.5 bg-[#4da2ff] text-white border-2 border-[#000000] shadow-brutal-sm font-display text-sm font-bold hover:translate-x-[-2px] hover:translate-y-[-2px] hover:shadow-brutal active:translate-x-[1px] active:translate-y-[1px] transition-all rounded-xl mb-4 sm:mb-0">
              <i data-lucide="search" class="w-4 h-4 inline mr-2"></i>Cari Rute ini
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderRouteExplorer();
      const explorerSearch = document.getElementById('explorer-search');
      if (explorerSearch) {
        explorerSearch.addEventListener('input', handleExplorerSearch);
      }
      document.querySelectorAll('.explorer-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          explorerFilter = btn.dataset.filter || '';
          explorerPage = 1;
          renderRouteExplorer();
        });
      });
    });
  </script>
</body>
</html>
